# nginx on the VPS, in front of docker-compose.prod.yml (docs/deploy.md). One host, two upstreams:
# Hydra's public endpoints go to Hydra, everything else to the login application.
# Replace auth.gostyle.uk with UNI_AUTH_HOST, then: certbot --nginx -d auth.gostyle.uk
#
# Never proxied: Hydra's admin API (not published at all) and /hooks/ (Hydra calls the
# refresh hook inside the compose network).

server {
    listen 80;
    server_name auth.gostyle.uk;

    client_max_body_size 64k;

    # Hydra: the OAuth 2.0 / OpenID Connect endpoints.
    location ~ ^/(oauth2/|\.well-known/|userinfo$) {
        proxy_pass http://127.0.0.1:4444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hooks/ {
        return 404;
    }

    # The login application: sign-in, sign-up, consent, sign-out screens and their assets.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
