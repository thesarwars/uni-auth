# nginx on the VPS, in front of docker-compose.prod.yml (docs/deploy.md). One host, two upstreams:
# Hydra's public endpoints go to Hydra, everything else to the login application.
# Replace uni-auth.gostyle.uk with UNI_AUTH_HOST, then: certbot --nginx -d uni-auth.gostyle.uk
#
# Never proxied: Hydra's admin API (not published at all) and /hooks/ (Hydra calls the
# refresh hook inside the compose network).

server {
    listen 80;
    server_name uni-auth.gostyle.uk;

    client_max_body_size 64k;

    # Hydra's login and consent challenges and verifiers carry the whole flow, and a
    # re-authentication ("Confirm it's you") also carries the id_token_hint: redirects to and
    # from Hydra run to several KB, past nginx's default 4-8 KB for a response's headers, which
    # answers 502 ("upstream sent too big header"). Room for them, in both directions.
    large_client_header_buffers 4 32k;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Hydra: the OAuth 2.0 / OpenID Connect endpoints.
    location ~ ^/(oauth2/|\.well-known/|userinfo$) {
        proxy_pass http://127.0.0.1:4444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hooks/ {
        return 404;
    }

    # The login application: sign-in, sign-up, consent, sign-out screens and their assets.
    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
