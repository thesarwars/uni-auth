# uni-auth, local: Hydra and its database, and uni-auth's own identity database. The login
# application runs on the host at :3100.
#
#   scripts/dev-secrets.sh            once: writes .env with random local secrets
#   docker compose up -d --wait       Hydra on :4444 (public) and 127.0.0.1:4445 (admin),
#                                     the identity database on 127.0.0.1:5434
#   node scripts/db-migrate.mjs       applies db/migrations as the owner
#   node scripts/db-dev-roles.mjs     the login role the application connects as
#   scripts/hydra-keys.sh             ES256 signing keys
#   scripts/hydra-clients.sh          registers deploy/hydra/clients/*.json

name: uni-auth

services:
  # uni-auth's own user store: identities, identifiers, credentials, sessions and the
  # authentication journal (db/migrations). Separate from Hydra's database, which holds only
  # the protocol's state. Published on loopback for the login application on the host.
  identity-db:
    image: postgres:16
    environment:
      POSTGRES_USER: uni_auth_owner
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?run scripts/dev-secrets.sh}
      POSTGRES_DB: identity
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - identity-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uni_auth_owner -d identity']
      interval: 2s
      retries: 30

  # The sign-in throttle (auth-plan.md section 9, AU-G6). Counters only, nothing durable.
  redis:
    image: redis:7.4
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      retries: 30

  hydra-db:
    image: postgres:16
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: ${HYDRA_DB_PASSWORD:?run scripts/dev-secrets.sh}
      POSTGRES_DB: hydra
    volumes:
      - hydra-db:/var/lib/postgresql/data
    networks: [internal]
    # No published port: only Hydra talks to its database.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hydra -d hydra']
      interval: 2s
      retries: 30

  hydra-migrate:
    image: oryd/hydra:v25.4.0
    command: migrate sql up -e --yes
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD}@hydra-db:5432/hydra?sslmode=disable
    networks: [internal]
    depends_on:
      hydra-db: { condition: service_healthy }
    restart: 'no'

  hydra:
    image: oryd/hydra:v25.4.0
    # --dev permits the http:// issuer on localhost. Never in a deployment.
    command: serve all --dev --sqa-opt-out --config /etc/hydra/hydra.yml
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD}@hydra-db:5432/hydra?sslmode=disable
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM:?run scripts/dev-secrets.sh}
      SECRETS_COOKIE: ${HYDRA_SECRETS_COOKIE:?run scripts/dev-secrets.sh}
    volumes:
      - ./deploy/hydra/hydra.yml:/etc/hydra/hydra.yml:ro
    ports:
      - '127.0.0.1:4444:4444'
      # Admin is loopback-only even locally: it can register clients and accept any login
      # (AU-2). A deployment publishes it on no interface at all.
      - '127.0.0.1:4445:4445'
    networks: [internal]
    depends_on:
      hydra-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4444/health/ready']
      interval: 5s
      retries: 20

volumes:
  identity-db:
  hydra-db:

networks:
  internal:
