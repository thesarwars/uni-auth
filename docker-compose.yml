# uni-auth, local: Hydra and its database, and uni-auth's own identity database. The login
# application runs on the host at :3100.
#
#   scripts/dev-secrets.sh            once: writes .env with random local secrets
#   docker compose up -d --wait       Hydra on :4444 (public) and 127.0.0.1:4445 (admin),
#                                     the identity database on 127.0.0.1:5434
#   node scripts/db-migrate.mjs       applies db/migrations as the owner
#   node scripts/db-dev-roles.mjs     the login role the application connects as
#   scripts/hydra-keys.sh             ES256 signing keys
#   scripts/hydra-clients.sh          registers deploy/hydra/clients/*.json

name: uni-auth

services:
  # uni-auth's own user store: identities, identifiers, credentials, sessions and the
  # authentication journal (db/migrations). Separate from Hydra's database, which holds only
  # the protocol's state. Published on loopback for the login application on the host.
  identity-db:
    image: postgres:16
    environment:
      POSTGRES_USER: uni_auth_owner
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?run scripts/dev-secrets.sh}
      POSTGRES_DB: identity
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - identity-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uni_auth_owner -d identity']
      interval: 2s
      retries: 30

  # The sign-in throttle (auth-plan.md section 9, AU-G6). Counters only, nothing durable.
  redis:
    image: redis:7.4
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      retries: 30

  hydra-db:
    image: postgres:16
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: ${HYDRA_DB_PASSWORD:?run scripts/dev-secrets.sh}
      POSTGRES_DB: hydra
    volumes:
      - hydra-db:/var/lib/postgresql/data
    networks: [internal]
    # No published port: only Hydra talks to its database.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hydra -d hydra']
      interval: 2s
      retries: 30

  hydra-migrate:
    image: oryd/hydra:v25.4.0
    command: migrate sql up -e --yes
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD}@hydra-db:5432/hydra?sslmode=disable
    networks: [internal]
    depends_on:
      hydra-db: { condition: service_healthy }
    restart: 'no'

  hydra:
    image: oryd/hydra:v25.4.0
    # --dev permits the http:// issuer on localhost. Never in a deployment.
    command: serve all --dev --sqa-opt-out --config /etc/hydra/hydra.yml
    environment:
      # The pool is sized, not left at Hydra's default of two per CPU: a code exchange holds a
      # transaction and takes a second connection for the signing key, so a small pool deadlocks
      # under concurrent sign-ins (found by tests/load/sign-in.load.ts; auth-plan.md part 8).
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD}@hydra-db:5432/hydra?sslmode=disable&max_conns=40&max_idle_conns=10&max_conn_lifetime=30m
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM:?run scripts/dev-secrets.sh}
      SECRETS_COOKIE: ${HYDRA_SECRETS_COOKIE:?run scripts/dev-secrets.sh}
      # How Hydra proves itself to the login application's refresh hook (hydra.yml).
      OAUTH2_REFRESH_TOKEN_HOOK_AUTH_CONFIG_VALUE: Bearer ${HYDRA_HOOK_SECRET:?run scripts/dev-secrets.sh}
    volumes:
      - ./deploy/hydra/hydra.yml:/etc/hydra/hydra.yml:ro
    ports:
      - '127.0.0.1:4444:4444'
      # Admin is loopback-only even locally: it can register clients and accept any login
      # (AU-2). A deployment publishes it on no interface at all.
      - '127.0.0.1:4445:4445'
    networks: [internal]
    depends_on:
      hydra-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4444/health/ready']
      interval: 5s
      retries: 20

  # Profile photos (S3_PHOTO_BUCKET): s3mock stands in for S3, the same image GSN's api uses.
  # Files are kept in the s3 volume. In .env: S3_PHOTO_BUCKET=entity-photos
  # S3_ENDPOINT=http://localhost:9100 S3_ACCESS_KEY_ID=local S3_SECRET_ACCESS_KEY=local
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: entity-photos
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: eu-west-2
      # The image runs as cnb, which owns /home/cnb: a volume there is writable.
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /home/cnb/store
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    ports: ['127.0.0.1:9100:9090']
    volumes:
      - s3:/home/cnb

  # MaxMind GeoLite2 City into ./data/geoip, for locations on Devices and Security activity.
  # Optional: put MAXMIND_ACCOUNT_ID, MAXMIND_LICENSE_KEY and
  # GEOIP_DB_PATH=./data/geoip/GeoLite2-City.mmdb in .env, then
  #   docker compose --profile geoip up -d geoipupdate
  geoipupdate:
    image: maxmindinc/geoipupdate:v7.1.1
    profiles: [geoip]
    restart: unless-stopped
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      GEOIPUPDATE_FREQUENCY: 72
    volumes:
      - ./data/geoip:/usr/share/GeoIP

volumes:
  identity-db:
  hydra-db:
  s3:

networks:
  internal:
